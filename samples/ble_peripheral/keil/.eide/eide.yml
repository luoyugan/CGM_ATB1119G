outDir: build
miscInfo:
  uid: 8bbbab8194cf782e5d8f01bff2d84f1a
targets:
  zephyr:
    cppPreprocessAttrs:
      defineList: []
      incList:
        - ../src/include
        - ../../../include/rbuf
        - .cmsis/include
        - RTE/_zephyr
      libList: []
    excludeList: []
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks:
            - name: "[Copy linker output for Keil User Commands]"
              abortAfterFailed: true
              command: mkdir ${KEIL_OUTPUT_DIR} & copy "${OutDir}\${ProjectName}.axf" "${KEIL_OUTPUT_DIR}\${KEIL_OUTPUT_NAME}.axf"
              disable: false
            - name: UserCommand.bat "!L" "$K\ARM"
              abortAfterFailed: true
              command: UserCommand.bat "${KEIL_OUTPUT_DIR}\${KEIL_OUTPUT_NAME}.axf" "${ToolchainRoot}\\ARM"
              disable: false
            - name: PackCommand.bat
              abortAfterFailed: true
              command: PackCommand.bat
              disable: false
          asm-compiler:
            $use: asm-auto
            defines:
              - _ASMLANGUAGE
            misc-controls: -imacros./linker_conf.h -imacros../src/include/autoconf.h
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: -imacros./linker_conf.h -nostdlib -Wno-section
            C_FLAGS: -imacros./linker_conf.h -nostdlib -Wno-section
            language-c: c99
            language-cpp: c++11
            link-time-optimization: false
            one-elf-section-per-function: true
            optimization: level-image-size
            short-enums#wchar: true
            warnings: ac5-like-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes:
              - .bin
            misc-controls: --no_startup --entry __start --keep=_irq_vector_table --keep=__init_* --keep=__device_* --keep=ksdfs.o(.ksdfs) --via linker_flag.txt
            output-format: elf
            ro-base: ""
            rw-base: ""
            xo-base: ""
        scatterFilePath: linker_pass_final.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x40000"
                startAddr: "0x0"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: IROM
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
